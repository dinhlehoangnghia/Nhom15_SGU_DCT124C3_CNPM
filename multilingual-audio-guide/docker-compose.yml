services:
  gateway:
    build: ./services/gateway
    ports:
      - "8000:8000"
    depends_on: [content, translation, tts]
  content:
    build: ./services/content
  translation:
    build: ./services/translation
    volumes:
      - translation_cache:/app/cache
  tts:
    build: ./services/tts
    volumes:
      - audio_data:/app/audio

volumes:
  audio_data:
  translation_cache: